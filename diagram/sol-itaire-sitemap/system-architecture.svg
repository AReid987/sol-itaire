<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
  </style>

  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>

    <!-- Arrow Markers -->
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="30" y="35" fill="white" font-size="18" font-weight="700">Sol-itaire System Architecture</text>
  <text x="30" y="52" fill="#94a3b8" font-size="10">Full-stack Web3 Gaming Platform</text>

  <!-- ==================== LAYER 1: USERS ==================== -->
  <rect x="30" y="70" width="1140" height="90" rx="12" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="45" y="86" fill="#64748b" font-size="9" font-weight="600">CLIENT LAYER</text>

  <!-- Browser -->
  <rect x="150" y="95" width="160" height="50" rx="6" fill="#0f172a"/>
  <rect x="150" y="95" width="160" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="230" y="118" fill="white" font-size="11" font-weight="600" text-anchor="middle">Browser</text>
  <text x="230" y="132" fill="#94a3b8" font-size="9" text-anchor="middle">Phantom / Solflare</text>

  <!-- Mobile -->
  <rect x="370" y="95" width="160" height="50" rx="6" fill="#0f172a"/>
  <rect x="370" y="95" width="160" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="450" y="118" fill="white" font-size="11" font-weight="600" text-anchor="middle">Mobile</text>
  <text x="450" y="132" fill="#94a3b8" font-size="9" text-anchor="middle">React Native (Planned)</text>

  <!-- API Client -->
  <rect x="590" y="95" width="160" height="50" rx="6" fill="#0f172a"/>
  <rect x="590" y="95" width="160" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="670" y="118" fill="white" font-size="11" font-weight="600" text-anchor="middle">API Client</text>
  <text x="670" y="132" fill="#94a3b8" font-size="9" text-anchor="middle">Direct API Access</text>

  <!-- ==================== LAYER 2: FRONTEND ==================== -->
  <rect x="30" y="180" width="1140" height="140" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="45" y="196" fill="#22d3ee" font-size="9" font-weight="600">FRONTEND LAYER — Next.js 15</text>

  <!-- Next.js App -->
  <rect x="80" y="210" width="180" height="60" rx="6" fill="#0f172a"/>
  <rect x="80" y="210" width="180" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="170" y="234" fill="white" font-size="11" font-weight="600" text-anchor="middle">Next.js App</text>
  <text x="170" y="250" fill="#94a3b8" font-size="9" text-anchor="middle">React 18 + App Router</text>

  <!-- Game Components -->
  <rect x="300" y="210" width="180" height="60" rx="6" fill="#0f172a"/>
  <rect x="300" y="210" width="180" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="390" y="234" fill="white" font-size="11" font-weight="600" text-anchor="middle">Game Components</text>
  <text x="390" y="250" fill="#94a3b8" font-size="9" text-anchor="middle">Board, Cards, Piles</text>

  <!-- Wallet Adapter -->
  <rect x="520" y="210" width="180" height="60" rx="6" fill="#0f172a"/>
  <rect x="520" y="210" width="180" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="610" y="234" fill="white" font-size="11" font-weight="600" text-anchor="middle">Wallet Adapter</text>
  <text x="610" y="250" fill="#94a3b8" font-size="9" text-anchor="middle">Solana Web3.js</text>

  <!-- State Management -->
  <rect x="740" y="210" width="180" height="60" rx="6" fill="#0f172a"/>
  <rect x="740" y="210" width="180" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="830" y="234" fill="white" font-size="11" font-weight="600" text-anchor="middle">State Management</text>
  <text x="830" y="250" fill="#94a3b8" font-size="9" text-anchor="middle">Zustand + React Query</text>

  <!-- Styling -->
  <rect x="960" y="210" width="160" height="60" rx="6" fill="#0f172a"/>
  <rect x="960" y="210" width="160" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="1040" y="234" fill="white" font-size="11" font-weight="600" text-anchor="middle">Styling</text>
  <text x="1040" y="250" fill="#94a3b8" font-size="9" text-anchor="middle">Tailwind + Framer Motion</text>

  <!-- ==================== LAYER 3: BACKEND ==================== -->
  <rect x="30" y="340" width="1140" height="160" rx="12" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="45" y="356" fill="#34d399" font-size="9" font-weight="600">BACKEND LAYER — Express.js</text>

  <!-- Auth Service -->
  <rect x="80" y="370" width="150" height="55" rx="6" fill="#0f172a"/>
  <rect x="80" y="370" width="150" height="55" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="155" y="393" fill="white" font-size="11" font-weight="600" text-anchor="middle">Auth</text>
  <text x="155" y="409" fill="#94a3b8" font-size="9" text-anchor="middle">JWT + Wallet Sig</text>

  <!-- Game Service -->
  <rect x="260" y="370" width="150" height="55" rx="6" fill="#0f172a"/>
  <rect x="260" y="370" width="150" height="55" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="335" y="393" fill="white" font-size="11" font-weight="600" text-anchor="middle">Games</text>
  <text x="335" y="409" fill="#94a3b8" font-size="9" text-anchor="middle">CRUD + Validation</text>

  <!-- Leaderboard -->
  <rect x="440" y="370" width="150" height="55" rx="6" fill="#0f172a"/>
  <rect x="440" y="370" width="150" height="55" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="515" y="393" fill="white" font-size="11" font-weight="600" text-anchor="middle">Leaderboard</text>
  <text x="515" y="409" fill="#94a3b8" font-size="9" text-anchor="middle">Rankings + Stats</text>

  <!-- Transactions -->
  <rect x="620" y="370" width="150" height="55" rx="6" fill="#0f172a"/>
  <rect x="620" y="370" width="150" height="55" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="695" y="393" fill="white" font-size="11" font-weight="600" text-anchor="middle">Transactions</text>
  <text x="695" y="409" fill="#94a3b8" font-size="9" text-anchor="middle">Verify + Track</text>

  <!-- Statistics -->
  <rect x="800" y="370" width="150" height="55" rx="6" fill="#0f172a"/>
  <rect x="800" y="370" width="150" height="55" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="875" y="393" fill="white" font-size="11" font-weight="600" text-anchor="middle">Statistics</text>
  <text x="875" y="409" fill="#94a3b8" font-size="9" text-anchor="middle">Analytics</text>

  <!-- Users -->
  <rect x="980" y="370" width="150" height="55" rx="6" fill="#0f172a"/>
  <rect x="980" y="370" width="150" height="55" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="1055" y="393" fill="white" font-size="11" font-weight="600" text-anchor="middle">Users</text>
  <text x="1055" y="409" fill="#94a3b8" font-size="9" text-anchor="middle">Profiles + Search</text>

  <!-- Middleware Bar -->
  <rect x="80" y="445" width="1050" height="35" rx="6" fill="#0f172a"/>
  <rect x="80" y="445" width="1050" height="35" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="605" y="467" fill="white" font-size="10" font-weight="600" text-anchor="middle">Middleware: Helmet • CORS • Rate Limiting • Morgan • Compression</text>

  <!-- ==================== LAYER 4: SMART CONTRACTS ==================== -->
  <rect x="30" y="520" width="1140" height="160" rx="12" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="45" y="536" fill="#a78bfa" font-size="9" font-weight="600">BLOCKCHAIN LAYER — Solana / Anchor</text>

  <!-- Solitaire Program -->
  <rect x="120" y="550" width="200" height="70" rx="6" fill="#0f172a"/>
  <rect x="120" y="550" width="200" height="70" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="220" y="576" fill="white" font-size="11" font-weight="600" text-anchor="middle">Solitaire Program</text>
  <text x="220" y="592" fill="#94a3b8" font-size="9" text-anchor="middle">Game Logic + Moves</text>
  <text x="220" y="606" fill="#a78bfa" font-size="8" text-anchor="middle">Fg6PaFpo...LnS</text>

  <!-- Gaming Token Program -->
  <rect x="420" y="550" width="200" height="70" rx="6" fill="#0f172a"/>
  <rect x="420" y="550" width="200" height="70" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="520" y="576" fill="white" font-size="11" font-weight="600" text-anchor="middle">Gaming Token</text>
  <text x="520" y="592" fill="#94a3b8" font-size="9" text-anchor="middle">GAME SPL Token</text>
  <text x="520" y="606" fill="#a78bfa" font-size="8" text-anchor="middle">DhkqYC1m...NB8</text>

  <!-- Memecoin Program -->
  <rect x="720" y="550" width="200" height="70" rx="6" fill="#0f172a"/>
  <rect x="720" y="550" width="200" height="70" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="820" y="576" fill="white" font-size="11" font-weight="600" text-anchor="middle">Memecoin Program</text>
  <text x="820" y="592" fill="#94a3b8" font-size="9" text-anchor="middle">MEME Rewards</text>
  <text x="820" y="606" fill="#a78bfa" font-size="8" text-anchor="middle">A1WF2rG5...kqT</text>

  <!-- On-chain Features -->
  <rect x="120" y="640" width="800" height="25" rx="4" fill="#0f172a"/>
  <rect x="120" y="640" width="800" height="25" rx="4" fill="rgba(76,29,149,0.2)" stroke="#a78bfa" stroke-width="0.5"/>
  <text x="520" y="657" fill="#a78bfa" font-size="8" text-anchor="middle">On-chain: Game State • Move Validation • Stake Escrow • Reward Distribution • Token Minting • Airdrops</text>

  <!-- ==================== LAYER 5: STORAGE ==================== -->
  <rect x="30" y="700" width="1140" height="90" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="45" y="716" fill="#fbbf24" font-size="9" font-weight="600">DATA LAYER</text>

  <!-- SQLite -->
  <rect x="120" y="725" width="160" height="50" rx="6" fill="#0f172a"/>
  <rect x="120" y="725" width="160" height="50" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="200" y="748" fill="white" font-size="11" font-weight="600" text-anchor="middle">SQLite</text>
  <text x="200" y="762" fill="#94a3b8" font-size="9" text-anchor="middle">Game State DB</text>

  <!-- Solana Ledger -->
  <rect x="340" y="725" width="160" height="50" rx="6" fill="#0f172a"/>
  <rect x="340" y="725" width="160" height="50" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="420" y="748" fill="white" font-size="11" font-weight="600" text-anchor="middle">Solana Ledger</text>
  <text x="420" y="762" fill="#94a3b8" font-size="9" text-anchor="middle">On-chain State</text>

  <!-- Token Accounts -->
  <rect x="560" y="725" width="160" height="50" rx="6" fill="#0f172a"/>
  <rect x="560" y="725" width="160" height="50" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="640" y="748" fill="white" font-size="11" font-weight="600" text-anchor="middle">Token Accounts</text>
  <text x="640" y="762" fill="#94a3b8" font-size="9" text-anchor="middle">GAME + MEME Balances</text>

  <!-- IPFS -->
  <rect x="780" y="725" width="160" height="50" rx="6" fill="#0f172a"/>
  <rect x="780" y="725" width="160" height="50" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="860" y="748" fill="white" font-size="11" font-weight="600" text-anchor="middle">IPFS</text>
  <text x="860" y="762" fill="#94a3b8" font-size="9" text-anchor="middle">Metadata (Planned)</text>

  <!-- ==================== CONNECTIONS ==================== -->
  <!-- Clients to Frontend -->
  <line x1="230" y1="145" x2="170" y2="210" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <line x1="450" y1="145" x2="390" y2="210" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <line x1="670" y1="145" x2="610" y2="210" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- Frontend to Backend -->
  <line x1="170" y1="270" x2="155" y2="370" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <line x1="390" y1="270" x2="335" y2="370" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <line x1="830" y1="270" x2="875" y2="370" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

  <!-- Wallet to Blockchain -->
  <line x1="610" y1="270" x2="520" y2="550" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-violet)"/>
  <text x="580" y="420" fill="#a78bfa" font-size="8" text-anchor="middle" transform="rotate(-70,580,420)">RPC</text>

  <!-- Backend to Blockchain -->
  <line x1="335" y1="425" x2="220" y2="550" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <line x1="695" y1="425" x2="520" y2="550" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <line x1="1055" y1="425" x2="820" y2="550" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>

  <!-- Blockchain to Storage -->
  <line x1="220" y1="620" x2="200" y2="725" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <line x1="520" y1="620" x2="420" y2="725" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <line x1="820" y1="620" x2="640" y2="725" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- ==================== LEGEND ==================== -->
  <rect x="900" y="710" width="250" height="160" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="920" y="730" fill="white" font-size="10" font-weight="600">Legend</text>

  <rect x="920" y="740" width="12" height="12" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="940" y="750" fill="#94a3b8" font-size="9">Frontend / Client</text>

  <rect x="920" y="760" width="12" height="12" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="940" y="770" fill="#94a3b8" font-size="9">Backend / Services</text>

  <rect x="920" y="780" width="12" height="12" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="940" y="790" fill="#94a3b8" font-size="9">Blockchain / Smart Contracts</text>

  <rect x="920" y="800" width="12" height="12" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="940" y="810" fill="#94a3b8" font-size="9">Data / Storage</text>

  <rect x="920" y="820" width="12" height="12" rx="2" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="940" y="830" fill="#94a3b8" font-size="9">Middleware / Bus</text>

  <line x1="920" y1="848" x2="940" y2="848" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="948" y="852" fill="#94a3b8" font-size="9">Async / RPC Connection</text>

</svg>
