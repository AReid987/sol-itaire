<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
  </style>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="500" y="35" fill="white" font-size="18" font-weight="700" text-anchor="middle">Sol-itaire User Flow</text>
  <text x="500" y="52" fill="#94a3b8" font-size="10" text-anchor="middle">Complete Journey: Onboarding → Gameplay → Rewards</text>

  <!-- ==================== START ==================== -->
  <!-- Start Node -->
  <g transform="translate(500, 90)">
    <circle r="25" fill="#0f172a"/>
    <circle r="25" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="2"/>
    <text y="5" fill="white" font-size="11" font-weight="600" text-anchor="middle">START</text>
  </g>

  <!-- Arrow to Landing -->
  <line x1="500" y1="115" x2="500" y2="150" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- ==================== LANDING PAGE ==================== -->
  <rect x="380" y="155" width="240" height="50" rx="25" fill="#0f172a"/>
  <rect x="380" y="155" width="240" height="50" rx="25" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="500" y="180" fill="white" font-size="11" font-weight="600" text-anchor="middle">Landing Page</text>
  <text x="500" y="194" fill="#94a3b8" font-size="9" text-anchor="middle">Welcome Screen</text>

  <!-- Arrow to Decision -->
  <line x1="500" y1="205" x2="500" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- ==================== WALLET CONNECTED? ==================== -->
  <g transform="translate(500, 290)">
    <polygon points="0,-40 70,0 0,40 -70,0" fill="#0f172a"/>
    <polygon points="0,-40 70,0 0,40 -70,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="4" fill="white" font-size="10" font-weight="600" text-anchor="middle">Wallet</text>
    <text y="16" fill="white" font-size="10" font-weight="600" text-anchor="middle">Connected?</text>
  </g>

  <!-- No Branch - Connect Wallet -->
  <line x1="430" y1="290" x2="250" y2="290" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <text x="340" y="283" fill="#fb7185" font-size="9" text-anchor="middle">No</text>

  <!-- Connect Wallet Box -->
  <rect x="90" y="265" width="160" height="50" rx="6" fill="#0f172a"/>
  <rect x="90" y="265" width="160" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="170" y="288" fill="white" font-size="11" font-weight="600" text-anchor="middle">Connect Wallet</text>
  <text x="170" y="302" fill="#94a3b8" font-size="9" text-anchor="middle">Phantom / Solflare</text>

  <!-- Loop back from Connect Wallet -->
  <path d="M 170 315 L 170 340 L 500 340 L 500 330" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Yes Branch -->
  <line x1="500" y1="330" x2="500" y2="380" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="510" y="360" fill="#34d399" font-size="9">Yes</text>

  <!-- ==================== CHECK USERNAME ==================== -->
  <g transform="translate(500, 430)">
    <polygon points="0,-40 70,0 0,40 -70,0" fill="#0f172a"/>
    <polygon points="0,-40 70,0 0,40 -70,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="4" fill="white" font-size="10" font-weight="600" text-anchor="middle">Username</text>
    <text y="16" fill="white" font-size="10" font-weight="600" text-anchor="middle">Set?</text>
  </g>

  <!-- No Branch - Set Username -->
  <line x1="430" y1="430" x2="250" y2="430" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <text x="340" y="423" fill="#fb7185" font-size="9" text-anchor="middle">No</text>

  <rect x="90" y="405" width="160" height="50" rx="6" fill="#0f172a"/>
  <rect x="90" y="405" width="160" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="170" y="428" fill="white" font-size="11" font-weight="600" text-anchor="middle">Set Username</text>
  <text x="170" y="442" fill="#94a3b8" font-size="9" text-anchor="middle">3-20 characters</text>

  <path d="M 170 455 L 170 480 L 500 480 L 500 470" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Yes Branch -->
  <line x1="500" y1="470" x2="500" y2="520" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="510" y="500" fill="#34d399" font-size="9">Yes</text>

  <!-- ==================== CHECK TOKENS ==================== -->
  <g transform="translate(500, 570)">
    <polygon points="0,-40 70,0 0,40 -70,0" fill="#0f172a"/>
    <polygon points="0,-40 70,0 0,40 -70,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="4" fill="white" font-size="10" font-weight="600" text-anchor="middle">Has GAME</text>
    <text y="16" fill="white" font-size="10" font-weight="600" text-anchor="middle">Tokens?</text>
  </g>

  <!-- No Branch - Get Tokens -->
  <line x1="430" y1="570" x2="250" y2="570" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <text x="340" y="563" fill="#fb7185" font-size="9" text-anchor="middle">No</text>

  <rect x="90" y="545" width="160" height="50" rx="6" fill="#0f172a"/>
  <rect x="90" y="545" width="160" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="170" y="568" fill="white" font-size="11" font-weight="600" text-anchor="middle">Get Tokens</text>
  <text x="170" y="582" fill="#94a3b8" font-size="9" text-anchor="middle">Purchase / Airdrop</text>

  <path d="M 170 595 L 170 620 L 500 620 L 500 610" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Yes Branch -->
  <line x1="500" y1="610" x2="500" y2="660" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="510" y="640" fill="#34d399" font-size="9">Yes</text>

  <!-- ==================== STAKE TOKENS ==================== -->
  <rect x="380" y="665" width="240" height="50" rx="6" fill="#0f172a"/>
  <rect x="380" y="665" width="240" height="50" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="500" y="688" fill="white" font-size="11" font-weight="600" text-anchor="middle">Stake GAME Tokens</text>
  <text x="500" y="702" fill="#94a3b8" font-size="9" text-anchor="middle">50 / 100 / 250 / 500 / 1000</text>

  <!-- Arrow to Game Board -->
  <line x1="500" y1="715" x2="500" y2="760" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- ==================== GAME BOARD ==================== -->
  <rect x="350" y="765" width="300" height="60" rx="8" fill="#0f172a"/>
  <rect x="350" y="765" width="300" height="60" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="2"/>
  <text x="500" y="790" fill="white" font-size="12" font-weight="700" text-anchor="middle">Klondike Solitaire</text>
  <text x="500" y="808" fill="#94a3b8" font-size="9" text-anchor="middle">Stock • Waste • 4 Foundations • 7 Tableaus</text>

  <!-- ==================== GAME OUTCOMES ==================== -->
  <!-- Win Branch -->
  <line x1="500" y1="825" x2="500" y2="870" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

  <g transform="translate(500, 910)">
    <polygon points="0,-35 60,0 0,35 -60,0" fill="#0f172a"/>
    <polygon points="0,-35 60,0 0,35 -60,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="4" fill="white" font-size="10" font-weight="600" text-anchor="middle">Game</text>
    <text y="16" fill="white" font-size="10" font-weight="600" text-anchor="middle">Result?</text>
  </g>

  <!-- Win Path -->
  <line x1="440" y1="910" x2="250" y2="910" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="345" y="903" fill="#34d399" font-size="9" text-anchor="middle">Win</text>

  <rect x="90" y="885" width="160" height="50" rx="6" fill="#0f172a"/>
  <rect x="90" y="885" width="160" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="170" y="908" fill="white" font-size="11" font-weight="600" text-anchor="middle">2x Stake + MEME</text>
  <text x="170" y="922" fill="#34d399" font-size="9" text-anchor="middle">Win Rewards</text>

  <!-- Lose Path -->
  <line x1="560" y1="910" x2="750" y2="910" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <text x="655" y="903" fill="#fb7185" font-size="9" text-anchor="middle">Lose</text>

  <rect x="750" y="885" width="160" height="50" rx="6" fill="#0f172a"/>
  <rect x="750" y="885" width="160" height="50" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="830" y="908" fill="white" font-size="11" font-weight="600" text-anchor="middle">Stake Lost</text>
  <text x="830" y="922" fill="#fb7185" font-size="9" text-anchor="middle">0% Returned</text>

  <!-- ==================== CLAIM REWARDS ==================== -->
  <line x1="170" y1="935" x2="170" y2="980" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

  <rect x="90" y="985" width="160" height="50" rx="6" fill="#0f172a"/>
  <rect x="90" y="985" width="160" height="50" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="170" y="1008" fill="white" font-size="11" font-weight="600" text-anchor="middle">Claim Rewards</text>
  <text x="170" y="1022" fill="#94a3b8" font-size="9" text-anchor="middle">Sign Transaction</text>

  <!-- New Game Loop -->
  <line x1="170" y1="1035" x2="170" y2="1070" stroke="#64748b" stroke-width="1.5"/>
  <line x1="170" y1="1070" x2="500" y2="1070" stroke="#64748b" stroke-width="1.5"/>
  <line x1="500" y1="1070" x2="500" y2="1050" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="340" y="1063" fill="#64748b" font-size="8" text-anchor="middle">Play Again</text>

  <!-- ==================== END ==================== -->
  <line x1="830" y1="935" x2="830" y2="1070" stroke="#64748b" stroke-width="1.5"/>
  <line x1="830" y1="1070" x2="500" y2="1070" stroke="#64748b" stroke-width="1.5"/>

  <!-- ==================== LEGEND ==================== -->
  <rect x="700" y="100" width="250" height="120" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="720" y="120" fill="white" font-size="10" font-weight="600">Legend</text>

  <rect x="720" y="130" width="12" height="12" rx="25" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="740" y="140" fill="#94a3b8" font-size="9">Start / End</text>

  <rect x="720" y="150" width="12" height="12" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="740" y="160" fill="#94a3b8" font-size="9">Process Step</text>

  <polygon points="726,170 738,176 726,182 714,176" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="746" y="180" fill="#94a3b8" font-size="9">Decision</text>

  <line x1="714" y1="198" x2="738" y2="198" stroke="#34d399" stroke-width="1.5"/>
  <text x="746" y="202" fill="#94a3b8" font-size="9">Yes / Success</text>

  <line x1="714" y1="212" x2="738" y2="212" stroke="#fb7185" stroke-width="1.5"/>
  <text x="746" y="216" fill="#94a3b8" font-size="9">No / Failure</text>

</svg>
