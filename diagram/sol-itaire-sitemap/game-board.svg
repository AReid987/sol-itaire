<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
  </style>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <pattern id="felt" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#059669"/>
      <rect width="2" height="2" fill="#047857" opacity="0.3"/>
      <rect x="2" y="2" width="2" height="2" fill="#047857" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="550" y="35" fill="white" font-size="18" font-weight="700" text-anchor="middle">Sol-itaire Game Board Layout</text>
  <text x="550" y="52" fill="#94a3b8" font-size="10" text-anchor="middle">Klondike Solitaire — Standard Layout</text>

  <!-- ==================== GAME TABLE ==================== -->
  <rect x="50" y="70" width="1000" height="580" rx="16" fill="#0f172a"/>
  <rect x="50" y="70" width="1000" height="580" rx="16" fill="url(#felt)" opacity="0.5"/>
  <rect x="50" y="70" width="1000" height="580" rx="16" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="550" y="92" fill="#059669" font-size="10" font-weight="600" text-anchor="middle">GAME TABLE</text>

  <!-- ==================== TOP ROW: STOCK, WASTE, FOUNDATIONS ==================== -->

  <!-- Stock Pile -->
  <rect x="100" y="120" width="100" height="140" rx="8" fill="#0f172a"/>
  <rect x="100" y="120" width="100" height="140" rx="8" fill="rgba(100,116,139,0.3)" stroke="#64748b" stroke-width="1.5"/>
  <text x="150" y="185" fill="white" font-size="11" font-weight="600" text-anchor="middle">Stock</text>
  <text x="150" y="200" fill="#94a3b8" font-size="9" text-anchor="middle">Draw Pile</text>
  <!-- Card back pattern -->
  <rect x="110" y="130" width="80" height="110" rx="4" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="118" y="138" width="64" height="94" rx="2" fill="none" stroke="#3b82f6" stroke-width="0.5" stroke-dasharray="4,2"/>

  <!-- Arrow from Stock to Waste -->
  <line x1="200" y1="190" x2="250" y2="190" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="225" y="183" fill="#64748b" font-size="8" text-anchor="middle">Draw</text>

  <!-- Waste Pile -->
  <rect x="260" y="120" width="100" height="140" rx="8" fill="#0f172a"/>
  <rect x="260" y="120" width="100" height="140" rx="8" fill="rgba(100,116,139,0.2)" stroke="#64748b" stroke-width="1"/>
  <text x="310" y="185" fill="white" font-size="11" font-weight="600" text-anchor="middle">Waste</text>
  <text x="310" y="200" fill="#94a3b8" font-size="9" text-anchor="middle">Discard</text>
  <!-- Face-up card -->
  <rect x="275" y="130" width="70" height="100" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="295" y="160" fill="#ef4444" font-size="14" font-weight="700">K</text>
  <text x="295" y="180" fill="#ef4444" font-size="20">♥</text>

  <!-- Spacer -->

  <!-- Foundation 1 - Spades -->
  <rect x="500" y="120" width="100" height="140" rx="8" fill="#0f172a"/>
  <rect x="500" y="120" width="100" height="140" rx="8" fill="rgba(59,130,246,0.2)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="550" y="185" fill="white" font-size="11" font-weight="600" text-anchor="middle">Foundation</text>
  <text x="550" y="200" fill="#3b82f6" font-size="20" text-anchor="middle">♠</text>
  <text x="550" y="218" fill="#94a3b8" font-size="8" text-anchor="middle">Spades</text>

  <!-- Foundation 2 - Hearts -->
  <rect x="620" y="120" width="100" height="140" rx="8" fill="#0f172a"/>
  <rect x="620" y="120" width="100" height="140" rx="8" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="670" y="185" fill="white" font-size="11" font-weight="600" text-anchor="middle">Foundation</text>
  <text x="670" y="200" fill="#ef4444" font-size="20" text-anchor="middle">♥</text>
  <text x="670" y="218" fill="#94a3b8" font-size="8" text-anchor="middle">Hearts</text>

  <!-- Foundation 3 - Diamonds -->
  <rect x="740" y="120" width="100" height="140" rx="8" fill="#0f172a"/>
  <rect x="740" y="120" width="100" height="140" rx="8" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="790" y="185" fill="white" font-size="11" font-weight="600" text-anchor="middle">Foundation</text>
  <text x="790" y="200" fill="#ef4444" font-size="20" text-anchor="middle">♦</text>
  <text x="790" y="218" fill="#94a3b8" font-size="8" text-anchor="middle">Diamonds</text>

  <!-- Foundation 4 - Clubs -->
  <rect x="860" y="120" width="100" height="140" rx="8" fill="#0f172a"/>
  <rect x="860" y="120" width="100" height="140" rx="8" fill="rgba(34,197,94,0.2)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="910" y="185" fill="white" font-size="11" font-weight="600" text-anchor="middle">Foundation</text>
  <text x="910" y="200" fill="#22c55e" font-size="20" text-anchor="middle">♣</text>
  <text x="910" y="218" fill="#94a3b8" font-size="8" text-anchor="middle">Clubs</text>

  <!-- ==================== SEPARATOR ==================== -->
  <line x1="80" y1="290" x2="1020" y2="290" stroke="#1e293b" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="550" y="305" fill="#475569" font-size="9" text-anchor="middle">TABLEAU AREA</text>

  <!-- ==================== TABLEAU PILES ==================== -->

  <!-- Tableau 1 (1 card) -->
  <rect x="100" y="320" width="100" height="280" rx="8" fill="#0f172a"/>
  <rect x="100" y="320" width="100" height="280" rx="8" fill="rgba(245,158,11,0.1)" stroke="#f59e0b" stroke-width="1"/>
  <text x="150" y="340" fill="#f59e0b" font-size="9" font-weight="600" text-anchor="middle">T1</text>
  <!-- Face-down card -->
  <rect x="110" y="350" width="80" height="30" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <!-- Face-up card -->
  <rect x="110" y="385" width="80" height="100" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="130" y="410" fill="#22c55e" font-size="12" font-weight="700">A</text>
  <text x="130" y="430" fill="#22c55e" font-size="16">♣</text>

  <!-- Tableau 2 (2 cards) -->
  <rect x="230" y="320" width="100" height="280" rx="8" fill="#0f172a"/>
  <rect x="230" y="320" width="100" height="280" rx="8" fill="rgba(245,158,11,0.1)" stroke="#f59e0b" stroke-width="1"/>
  <text x="280" y="340" fill="#f59e0b" font-size="9" font-weight="600" text-anchor="middle">T2</text>
  <rect x="240" y="350" width="80" height="30" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="240" y="365" width="80" height="30" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="240" y="400" width="80" height="100" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="260" y="425" fill="#ef4444" font-size="12" font-weight="700">5</text>
  <text x="260" y="445" fill="#ef4444" font-size="16">♥</text>

  <!-- Tableau 3 (3 cards) -->
  <rect x="360" y="320" width="100" height="280" rx="8" fill="#0f172a"/>
  <rect x="360" y="320" width="100" height="280" rx="8" fill="rgba(245,158,11,0.1)" stroke="#f59e0b" stroke-width="1"/>
  <text x="410" y="340" fill="#f59e0b" font-size="9" font-weight="600" text-anchor="middle">T3</text>
  <rect x="370" y="350" width="80" height="25" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="370" y="365" width="80" height="25" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="370" y="380" width="80" height="25" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="370" y="410" width="80" height="100" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="390" y="435" fill="#3b82f6" font-size="12" font-weight="700">J</text>
  <text x="390" y="455" fill="#3b82f6" font-size="16">♠</text>

  <!-- Tableau 4 (4 cards) -->
  <rect x="490" y="320" width="100" height="280" rx="8" fill="#0f172a"/>
  <rect x="490" y="320" width="100" height="280" rx="8" fill="rgba(245,158,11,0.1)" stroke="#f59e0b" stroke-width="1"/>
  <text x="540" y="340" fill="#f59e0b" font-size="9" font-weight="600" text-anchor="middle">T4</text>
  <rect x="500" y="350" width="80" height="22" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="500" y="365" width="80" height="22" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="500" y="380" width="80" height="22" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="500" y="395" width="80" height="22" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="500" y="422" width="80" height="100" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="520" y="447" fill="#ef4444" font-size="12" font-weight="700">7</text>
  <text x="520" y="467" fill="#ef4444" font-size="16">♦</text>

  <!-- Tableau 5 (5 cards) -->
  <rect x="620" y="320" width="100" height="280" rx="8" fill="#0f172a"/>
  <rect x="620" y="320" width="100" height="280" rx="8" fill="rgba(245,158,11,0.1)" stroke="#f59e0b" stroke-width="1"/>
  <text x="670" y="340" fill="#f59e0b" font-size="9" font-weight="600" text-anchor="middle">T5</text>
  <rect x="630" y="350" width="80" height="20" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="630" y="363" width="80" height="20" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="630" y="376" width="80" height="20" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="630" y="389" width="80" height="20" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="630" y="402" width="80" height="20" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="630" y="427" width="80" height="100" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="650" y="452" fill="#22c55e" font-size="12" font-weight="700">10</text>
  <text x="650" y="472" fill="#22c55e" font-size="16">♣</text>

  <!-- Tableau 6 (6 cards) -->
  <rect x="750" y="320" width="100" height="280" rx="8" fill="#0f172a"/>
  <rect x="750" y="320" width="100" height="280" rx="8" fill="rgba(245,158,11,0.1)" stroke="#f59e0b" stroke-width="1"/>
  <text x="800" y="340" fill="#f59e0b" font-size="9" font-weight="600" text-anchor="middle">T6</text>
  <rect x="760" y="350" width="80" height="18" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="760" y="362" width="80" height="18" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="760" y="374" width="80" height="18" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="760" y="386" width="80" height="18" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="760" y="398" width="80" height="18" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="760" y="410" width="80" height="18" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="760" y="433" width="80" height="100" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="780" y="458" fill="#3b82f6" font-size="12" font-weight="700">Q</text>
  <text x="780" y="478" fill="#3b82f6" font-size="16">♠</text>

  <!-- Tableau 7 (7 cards) -->
  <rect x="880" y="320" width="100" height="280" rx="8" fill="#0f172a"/>
  <rect x="880" y="320" width="100" height="280" rx="8" fill="rgba(245,158,11,0.1)" stroke="#f59e0b" stroke-width="1"/>
  <text x="930" y="340" fill="#f59e0b" font-size="9" font-weight="600" text-anchor="middle">T7</text>
  <rect x="890" y="350" width="80" height="16" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="890" y="361" width="80" height="16" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="890" y="372" width="80" height="16" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="890" y="383" width="80" height="16" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="890" y="394" width="80" height="16" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="890" y="405" width="80" height="16" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="890" y="416" width="80" height="16" rx="3" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <rect x="890" y="437" width="80" height="100" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="910" y="462" fill="#ef4444" font-size="12" font-weight="700">3</text>
  <text x="910" y="482" fill="#ef4444" font-size="16">♥</text>

  <!-- ==================== LEGEND ==================== -->
  <rect x="50" y="660" width="1000" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="100" y="680" fill="white" font-size="9" font-weight="600">Legend:</text>
  <rect x="160" y="670" width="12" height="12" rx="2" fill="rgba(37,99,235,0.4)" stroke="#2563eb" stroke-width="1"/>
  <text x="178" y="680" fill="#94a3b8" font-size="8">Face-down</text>
  <rect x="250" y="670" width="12" height="12" rx="2" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="268" y="680" fill="#94a3b8" font-size="8">Face-up</text>
  <rect x="330" y="670" width="12" height="12" rx="2" fill="rgba(100,116,139,0.3)" stroke="#64748b" stroke-width="1"/>
  <text x="348" y="680" fill="#94a3b8" font-size="8">Empty Pile</text>
  <rect x="430" y="670" width="12" height="12" rx="2" fill="rgba(245,158,11,0.1)" stroke="#f59e0b" stroke-width="1"/>
  <text x="448" y="680" fill="#94a3b8" font-size="8">Tableau</text>
  <rect x="510" y="670" width="12" height="12" rx="2" fill="rgba(59,130,246,0.2)" stroke="#3b82f6" stroke-width="1"/>
  <text x="528" y="680" fill="#94a3b8" font-size="8">Foundation</text>

</svg>
